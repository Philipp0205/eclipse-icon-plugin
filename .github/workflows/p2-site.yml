name: Build and publish p2 update site

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TYCHO_VERSION: "5.0.3"
  FEATURE_IU: com.github.eclipse.instanceicon.feature.feature.group

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and verify p2 repository
        run: ./mvnw --batch-mode clean verify
      - name: Resolve feature installation
        run: >-
          ./mvnw --batch-mode --non-recursive
          org.eclipse.tycho:tycho-p2-director-plugin:${TYCHO_VERSION}:director
          -Ddestination=${{ runner.temp }}/p2-verify
          -Drepositories=file:${{ github.workspace }}/repository/target/repository/,https://download.eclipse.org/releases/2026-06/
          -DinstallIUs=${FEATURE_IU}
          -DverifyOnly=true
          -Dprofileproperties=org.eclipse.update.install.features=true
      - name: Upload p2 repository
        uses: actions/upload-artifact@v4
        with:
          name: p2-update-site
          path: repository/target/repository

  # GitHub Pages serves this repository's default branch, so the published
  # update site is the committed p2/ directory rather than a Pages artifact.
  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the update site and merge it with the published one
        run: ./mvnw --batch-mode clean verify -Ppublish-site
      - name: Refresh the published update site
        # merged-site already contains every previously published version, so
        # replacing p2/ wholesale does not drop anything a client may request.
        run: |
          rm -rf p2
          mkdir p2
          cp -a repository/target/merged-site/. p2/
      - name: Commit the published update site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A p2
          if git diff --cached --quiet; then
            echo "Update site is already up to date."
          else
            git commit -m "Publish p2 update site from ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi
